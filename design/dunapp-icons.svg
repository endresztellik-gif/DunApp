<svg
  xmlns="http://www.w3.org/2000/svg"
  style="display:none"
  aria-hidden="true"
>
  <!-- ============================================================
       DunApp Icon Sprite — v1.0
       "Dunai tájkép" design rendszer
       
       HASZNÁLAT:
         <svg width="24" height="24" aria-label="Meteorológia">
           <use href="/icons/dunapp-icons.svg#icon-meteo" />
         </svg>
       
       VAGY inline (React):
         import { ReactComponent as MeteoIcon } from './icons/dunapp-icons.svg';
       
       MÉRETEK: 24×24 (nav), 32×32 (kártyafejléc), 48×48 (modul hero)
       SZÍN: currentColor — szülőelem color értékét örökli
       ============================================================ -->

  <!-- --------------------------------------------------------
       METEOROLÓGIA
       Nap + felhő kombináció. A nap teljes (kör + sugárpálcák),
       a felhő jobbra lent átfedi — "részben felhős" jelleg.
       -------------------------------------------------------- -->
  <symbol id="icon-meteo" viewBox="0 0 24 24">
    <circle cx="10" cy="9" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- napsugaralak -->
    <line x1="10" y1="2" x2="10" y2="3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="10" y1="14.4" x2="10" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="3" y1="9" x2="4.6" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="15.4" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5.05" y1="5.05" x2="6.18" y2="6.18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="13.82" y1="11.82" x2="14.95" y2="12.95" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="14.95" y1="5.05" x2="13.82" y2="6.18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <!-- felhő -->
    <path
      d="M7 18 Q7 14.5 10.5 14.5 Q10 12 13 12.8 Q14.5 10.5 17 12 Q20 11.5 20 14.5 Q22 14.5 22 17 Q22 20 19 20 H10 Q7 20 7 18Z"
      fill="none"
      stroke="currentColor"
      stroke-width="1.4"
      stroke-linejoin="round"
    />
  </symbol>

  <!-- Meteorológia — teli (filled) variáns, ha kell highlight-hoz -->
  <symbol id="icon-meteo-fill" viewBox="0 0 24 24">
    <circle cx="10" cy="9" r="3.5" fill="currentColor" opacity=".9"/>
    <line x1="10" y1="2" x2="10" y2="3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="14.4" x2="10" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="9" x2="4.6" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15.4" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5.05" y1="5.05" x2="6.18" y2="6.18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="14.95" y1="5.05" x2="13.82" y2="6.18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path
      d="M7 18 Q7 14.5 10.5 14.5 Q10 12 13 12.8 Q14.5 10.5 17 12 Q20 11.5 20 14.5 Q22 14.5 22 17 Q22 20 19 20 H10 Q7 20 7 18Z"
      fill="currentColor"
      opacity=".75"
    />
  </symbol>

  <!-- --------------------------------------------------------
       VÍZÁLLÁS
       Mérőléc (négyszögletes fedett cső) + hullám vízszint +
       emelkedő nyíl. Tik-markok bal oldalon, rácsos léc jobb.
       -------------------------------------------------------- -->
  <symbol id="icon-water" viewBox="0 0 24 24">
    <!-- mérőléc test -->
    <rect x="6" y="3" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- tik-markok bal szélen -->
    <line x1="6" y1="7"  x2="9"  y2="7"  stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <line x1="6" y1="10" x2="8"  y2="10" stroke="currentColor" stroke-width="1"   stroke-linecap="round" opacity=".35"/>
    <line x1="6" y1="13" x2="9"  y2="13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <line x1="6" y1="16" x2="8"  y2="16" stroke="currentColor" stroke-width="1"   stroke-linecap="round" opacity=".35"/>
    <line x1="6" y1="19" x2="9"  y2="19" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <!-- víz kitöltés -->
    <clipPath id="water-clip">
      <rect x="6.8" y="3.8" width="10.4" height="16.4" rx="1.3"/>
    </clipPath>
    <rect x="6.8" y="13.5" width="10.4" height="6.8" rx="1" fill="currentColor" opacity=".18" clip-path="url(#water-clip)"/>
    <!-- hullámvonal a vízfelszínen -->
    <path
      d="M7 13.5 Q9 12 11 13.5 Q13 15 15 13.5 Q16.5 12.5 17 13.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.3"
      stroke-linecap="round"
    />
    <!-- emelkedő nyíl (narancssárga/amber — érdemes override-olni) -->
    <line x1="15" y1="13" x2="15" y2="7"  stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M12.5 9 L15 6.5 L17.5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Vízállás — csökkenő nyíl variáns -->
  <symbol id="icon-water-down" viewBox="0 0 24 24">
    <rect x="6" y="3" width="12" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="6" y1="7"  x2="9"  y2="7"  stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <line x1="6" y1="10" x2="8"  y2="10" stroke="currentColor" stroke-width="1"   stroke-linecap="round" opacity=".35"/>
    <line x1="6" y1="13" x2="9"  y2="13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <line x1="6" y1="16" x2="8"  y2="16" stroke="currentColor" stroke-width="1"   stroke-linecap="round" opacity=".35"/>
    <line x1="6" y1="19" x2="9"  y2="19" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <rect x="6.8" y="15" width="10.4" height="5.2" rx="1" fill="currentColor" opacity=".18"/>
    <path d="M7 15 Q9 13.5 11 15 Q13 16.5 15 15 Q16.5 14 17 15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="15" y1="8" x2="15" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M12.5 12 L15 14.5 L17.5 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- --------------------------------------------------------
       ASZÁLYINDIKÁTOR
       Nap (körök + sugarak) + repedező, száraz talaj.
       A repedés-minta 3 törött vonallal érzékelteti a szárazságot.
       -------------------------------------------------------- -->
  <symbol id="icon-drought" viewBox="0 0 24 24">
    <!-- nap -->
    <circle cx="12" cy="9" r="3.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="12" y1="2"    x2="12" y2="3.8"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="19"  y1="9"   x2="17.2" y2="9"   stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5"   y1="9"   x2="6.8"  y2="9"   stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="16.95" y1="5.05" x2="15.66" y2="6.34" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7.05"  y1="5.05" x2="8.34"  y2="6.34" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <!-- talajvonal -->
    <line x1="2" y1="16" x2="22" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
    <!-- repedések -->
    <path d="M5  16 L6.5 19.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M6.5 19.5 L9 17.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M9 17.5 L10.5 21" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M14 16 L16.5 19"  stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M16.5 19 L19 17"  stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>

  <!-- Aszály — extrém variáns (erős fény, mélyen repedt) -->
  <symbol id="icon-drought-severe" viewBox="0 0 24 24">
    <circle cx="12" cy="8.5" r="4.2" fill="currentColor" opacity=".15"/>
    <circle cx="12" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <line x1="12" y1="1.5" x2="12" y2="3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="19.5" y1="8.5" x2="17.5" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4.5" y1="8.5" x2="6.5" y2="8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17.3" y1="4.7" x2="15.8" y2="6.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="6.7" y1="4.7" x2="8.2" y2="6.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="2" y1="15.5" x2="22" y2="15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 15.5 L5.5 19 L8 17 L9.5 22"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 15.5 L15 19 L18 16.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- --------------------------------------------------------
       TALAJVÍZ / GROUNDWATER
       Kút-cső a felszín felett, alatta rétegzett talaj,
       a pórustérben kék árnyék jelzi a vizet.
       Mélységi skálajelzők jobb oldalon.
       -------------------------------------------------------- -->
  <symbol id="icon-groundwater" viewBox="0 0 24 24">
    <!-- kút cső (felszín feletti szakasz) -->
    <rect x="9" y="2" width="6" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- talajfelszín -->
    <path d="M2 12 Q12 10 22 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
    <!-- rétegezés vonalak -->
    <path d="M2 15 Q12 13.5 22 15" fill="none" stroke="currentColor" stroke-width="1"   stroke-linecap="round" opacity=".35"/>
    <path d="M2 18.5 Q12 17 22 18.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".25"/>
    <!-- talajvíz kitöltés zóna -->
    <path d="M2 15.5 Q12 14 22 15.5 L22 22 L2 22 Z" fill="currentColor" opacity=".12"/>
    <!-- kút cső folytatása a talajban (szaggatott) -->
    <line x1="12" y1="11" x2="12" y2="16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="1.5 2" opacity=".5"/>
    <!-- vízcsepp a cső aljánál -->
    <path d="M12 16.5 Q10.5 18 10.5 19.2 Q10.5 21 12 21 Q13.5 21 13.5 19.2 Q13.5 18 12 16.5Z"
          fill="currentColor" opacity=".45"/>
    <!-- mélységi jelölők jobb oldalon -->
    <line x1="19" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 1.5" opacity=".4"/>
    <line x1="19" y1="16" x2="21" y2="16" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 1.5" opacity=".4"/>
    <line x1="20" y1="12" x2="20" y2="16" stroke="currentColor" stroke-width=".8" opacity=".3"/>
  </symbol>

  <!-- --------------------------------------------------------
       ÉRTESÍTÉS / PUSH NOTIFICATION (bónusz ikon)
       Harang alapforma + hullámvonal az aljánál = "víziharang"
       -------------------------------------------------------- -->
  <symbol id="icon-alert-bell" viewBox="0 0 24 24">
    <!-- harang -->
    <path
      d="M12 3 Q8 3 7 7 L6 15 Q5 16 4 17 H20 Q19 16 18 15 L17 7 Q16 3 12 3Z"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- harang alsó hullám -->
    <path d="M9 17 Q9.5 15.5 11 17 Q12 18.2 13 17 Q14.5 15.5 15 17"
          fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <!-- csúcs -->
    <circle cx="12" cy="3" r="1" fill="currentColor" opacity=".7"/>
    <!-- csengettyű szár -->
    <path d="M10 20 Q12 22 14 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- --------------------------------------------------------
       TÉRKÉP / HELYSZÍN (bónusz ikon)
       Pin + hullámkörök = "monitoring állomás"
       -------------------------------------------------------- -->
  <symbol id="icon-station" viewBox="0 0 24 24">
    <!-- pin alak -->
    <path
      d="M12 2 C8.5 2 6 5 6 8 C6 12.5 12 20 12 20 C12 20 18 12.5 18 8 C18 5 15.5 2 12 2Z"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    />
    <circle cx="12" cy="8.5" r="2.5" fill="currentColor" opacity=".4"/>
    <!-- hullámkörök (jelzés) -->
    <path d="M5 17 Q8.5 15 12 17 Q15.5 19 19 17" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".4"/>
    <path d="M3 20 Q7.5 17.5 12 20 Q16.5 22.5 21 20" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".25"/>
  </symbol>

  <!-- --------------------------------------------------------
       DIAGRAM / GRAFIKON (bónusz ikon)
       Egyszerű vonaldiagram lefelé-felfelé trenddel
       -------------------------------------------------------- -->
  <symbol id="icon-chart" viewBox="0 0 24 24">
    <!-- tengelyek -->
    <line x1="3" y1="20" x2="21" y2="20" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
    <line x1="4" y1="4"  x2="4"  y2="20" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
    <!-- vonaldiagram -->
    <polyline
      points="4,16 7,12 10,14 13,8 17,10 21,6"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- pontok -->
    <circle cx="7"  cy="12" r="1.5" fill="currentColor"/>
    <circle cx="13" cy="8"  r="1.5" fill="currentColor"/>
    <circle cx="21" cy="6"  r="1.5" fill="currentColor"/>
  </symbol>

</svg>

<!--
=================================================================
  DUNAPP ICON SPRITE — REFERENCE
=================================================================

  IKON AZONOSÍTÓK:
    #icon-meteo           — Meteorológia (nap + felhő)
    #icon-meteo-fill      — Meteorológia (kitöltött variáns)
    #icon-water           — Vízállás (mérőléc + emelkedő)
    #icon-water-down      — Vízállás (csökkenő nyíl variáns)
    #icon-drought         — Aszályindikátor (nap + repedés)
    #icon-drought-severe  — Aszályindikátor (extrém variáns)
    #icon-groundwater     — Talajvíz (kút + rétegek)
    #icon-alert-bell      — Értesítési harang (push)
    #icon-station         — Monitoring állomás (pin + hullámok)
    #icon-chart           — Vonaldiagram

  HASZNÁLAT REACT-BAN:
  
    // App.tsx — sprite egyszer betöltve
    import './icons/dunapp-icons.svg';
    
    // Komponensben:
    const Icon = ({ id, size = 24, className = '' }) => (
      <svg width={size} height={size} aria-hidden className={className}>
        <use href={`/icons/dunapp-icons.svg#${id}`} />
      </svg>
    );
    
    <Icon id="icon-water" size={32} />

  SZÍN OVERRIDE:
    Az ikonok currentColor-t használnak, ezért a CSS color
    tulajdonsággal szabadon színezhetők:
    
    .active-nav-icon { color: var(--dun-wave-400); }
    .alert-icon      { color: var(--dun-alert-500); }
    .dimmed-icon     { color: var(--text-tertiary); }

=================================================================
-->
